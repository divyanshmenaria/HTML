<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Details Form</title>
</head>

<body>
    <center>
        <h1>Onlined Movie Ticket Booking System</h1>
    </center>
    <hr>
    <center>
        <nav>
            <a href="Movies/Online movie booking Ticket.html">HOME</a> |

            <a href="payment.html">PAYEMENT</a> |
        </nav>
    </center>

    <h2 align="center">Enter Payment Details</h2>

    <form>
        <table border="1" align="center" cellpadding="10" cellspacing="0">
            <tr>
                <td><label for="cardHolder">Card Holder Name</label></td>
                <td><input type="text" placeholder="Enter Card Holder Name"></td>
            </tr>
            <tr>
                <td><label for="cardNumber">Card Number</label></td>
                <td><input type="number" placeholder="Enter Card Number"></td>
            </tr>
            <tr>
                <td><label for="expiryDate">Expiry Date</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>CVV</label></td>
                <td><input type="password" placeholder="Enter CVV"></td>
            </tr>
            <tr>
                <td><label for="upiId">UPI ID</label></td>
                <td><input type="text" placeholder="Enter UPI ID"></td>
            </tr>
            <tr>
                <td><label>Bank Name</label></td>
                <td>
                    <select>
                        <option>HDFC Bank</option>
                        <option>IDBI BANK</option>
                        <option>AXIS BANK</option>
                        <option>ICICI BANK</option>
                        <option>SBI BANK</option>
                    </select>
                </td>
            </tr>
        </table>

        <br>

        <center>
            <button type="submit">Pay Now</button>
            <button type="reset">Clear</button>
        </center>
    </form>
    <center>
        <h2><b>Enjoy Your Movie Experience</b></h2>
    </center>
    <footer>
        <p align="center">Copyright &copy; 2026 Online Movie Ticket Booking System</p>
        </center>
    </footer>
</body>

</html>
